global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: task-manager-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  - job_name: task-manager-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
