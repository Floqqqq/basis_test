services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: .
      args:
        TARGET: api
    ports:
      - "${APP_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      APP_PORT: "8080"
      JWT_SECRET: "secret"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/task_manager?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: "task-manager-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"

  worker:
    build:
      context: .
      args:
        TARGET: worker
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/task_manager?sslmode=disable"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: "no-reply@task-manager.local"
      WORKER_METRICS_PORT: "9091"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: "task-manager-worker"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${WORKER_METRICS_HOST_PORT:-19091}:9091"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_manager
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
